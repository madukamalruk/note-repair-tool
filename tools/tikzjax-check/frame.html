<!doctype html>
<html>
<head><meta charset="utf-8"><title>frame</title></head>
<body>
<script>
// Renders ONE test with the real TikZJax and reports ok/fail to the parent page.
(function () {
  const id = new URLSearchParams(location.search).get('id');
  const log = [];
  console.log = (...a) => { log.push(a.join(' ')); };
  let done = false;
  function finish(ok, why) {
    if (done) return;
    done = true;
    parent.postMessage({ id, ok, why, log: log.slice(-25) }, '*');
  }
  document.addEventListener('tikzjax-load-finished', () => finish(true, 'svg'));
  setInterval(() => {
    if (/Emergency stop|! Undefined control|Fatal error|Could not find file input\.dvi/.test(log.join('\n'))) finish(false, 'tex error');
  }, 300);
  setTimeout(() => finish(false, 'timeout'), 60000);

  fetch('tests.json').then(r => r.json()).then(tests => {
    const t = tests.find(x => String(x.id) === id);
    const s = document.createElement('script');
    s.type = 'text/tikz';
    s.setAttribute('data-show-console', 'true');
    // same tidying as the obsidian-tikzjax plugin: trim every line, drop empty lines
    s.text = t.src.replaceAll('&nbsp;', '').split('\n').map(l => l.trim()).filter(l => l).join('\n');
    document.body.appendChild(s);
    const lib = document.createElement('script');
    lib.src = 'tikzjax.js';
    document.body.appendChild(lib);
  });
})();
</script>
</body>
</html>
